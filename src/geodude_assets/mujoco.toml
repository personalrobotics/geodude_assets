# MujocoRuntime settings for Geodude (see ssrobot's docs/mujoco.md): start at the cell's
# "ready" pose, and drive each Robotiq 2F-140 through its tendon actuator, whose control
# runs from 0 (open) to 255 (closed).
#
# The 2F-140's driver joints travel their full range whether or not the fingers are
# blocked: the spring links give way instead. So the actuator reads "closed" with an
# object between the fingers, and each gripper's opening is measured from its spring-link
# joint instead. Its position is -0.7019 rad closed on nothing, where the fingertips meet,
# and -0.0278 rad open, the same on both grippers. Closed on a 66 mm cylinder held across
# the fingers at the depths of sstsr's Robotiq2F140 side grasp, it reads 0.45 to 0.48.
#
# A gripper command ends when its fingers' motion ends (personalrobotics/ssrobot#219), by
# each gripper's completion detector on that opening: it reached its target once within
# goal_tolerance of it; it stopped short once its openings over stall_dwell_ns vary by
# no more than stall_delta. Both tolerances are 1/255, the resolution of the 2F-140's
# position register. The dwell was measured in MuJoCo over an unobstructed open, an empty
# close, and a close on that 66 mm cylinder: the fingers do not move for the first 20 to
# 40 ms after a command, so a dwell of 20 ms or less declares a stall before they start;
# from 50 ms up, the outcomes are the same (reached, reached, stopped short at 0.463). It
# is 100 ms, which was also consistent with the previous finger servo (80 ms and up).
schema = "ssrobot.MujocoProfile"
version = 2
keyframe = "ready"

[[grippers]]
gripper = "left_gripper"
actuators = [{ actuator = "left_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "left_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

[[grippers]]
gripper = "right_gripper"
actuators = [{ actuator = "right_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "right_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

# When left_arm_with_lift_q counts as at rest in this simulation: every joint within its
# variation for 96 ms, read every 2 ms control tick with none dropped. The variation is
# declared, the bound on what counts as still: the lift within 2 um, and each revolute
# joint within (2, 3, 2, 2, 2, 2) steps of 2*pi/2^17 rad, in joint order, carried over
# from personalrobotics/ssrobot#223. MuJoCo's settled state converges to solver or float
# tolerance, so it has no chatter to set a bound by (personalrobotics/ssrobot#224). The
# dwell is measured against it on the readings exactly as observed: one tick longer than
# the longest interval they stayed within it and then moved (94 ms), over reaches, out-
# and-backs through zero velocity, pauses, and single-joint moves, judged from each
# trajectory's end. MuJoCo source's values; the hardware is unmeasured. Evidence:
# evidence/mujoco-rest.json (sha256
# f867c4084f6ffcda3a6e66d9809b026db643d71c60a20afe0a2c6db5f20f46f8), written by
# ssrobot's scripts/calibrate_rest.py --robot geodude --commit geodude=daa864d4f09d at
# ssrobot ebecbcb5f810, 14 of 14 judged trials passing.
[[rest]]
channel = "left_arm_with_lift_q"
criteria = { max_gap_ns = 2000000, dwell_ns = 96000000, variation = [2e-06, 9.587379924285257e-05, 0.00014381069886427886, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05], source = "MuJoCo source's values: variation declared per joint ([2e-06, 9.587379924285257e-05, 0.00014381069886427886, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05]), the bound on what counts as still; dwell one tick longer than the longest interval that looked still and then moved, 94000000 ns, judged from each trajectory's end; measured by ssrobot scripts/calibrate_rest.py at ssrobot ebecbcb5f810 on personalrobotics/geodude_assets@daa864d4f09d; the hardware is unmeasured; evidence/mujoco-rest.json sha256 f867c4084f6ffcda3a6e66d9809b026db643d71c60a20afe0a2c6db5f20f46f8" }

# When right_arm_with_lift_q counts as at rest in this simulation: every joint within
