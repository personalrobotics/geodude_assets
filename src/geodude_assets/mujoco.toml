# MujocoRuntime settings for Geodude (see ssrobot's docs/mujoco.md): start at the cell's
# "ready" pose, and drive each Robotiq 2F-140 through its tendon actuator, whose control
# runs from 0 (open) to 255 (closed).
#
# The 2F-140's driver joints travel their full range whether or not the fingers are
# blocked: the spring links give way instead. So the actuator reads "closed" with an
# object between the fingers, and each gripper's opening is measured from its spring-link
# joint instead. Its position is -0.7019 rad closed on nothing, where the fingertips meet,
# and -0.0278 rad open, the same on both grippers. Closed on a 66 mm cylinder held across
# the fingers at the depths of sstsr's Robotiq2F140 side grasp, it reads 0.45 to 0.48.
#
# A gripper command ends when its fingers' motion ends (personalrobotics/ssrobot#219), by
# each gripper's completion detector on that opening: it reached its target once within
# goal_tolerance of it; it stopped short once its openings over stall_dwell_ns vary by
# no more than stall_delta. Both tolerances are 1/255, the resolution of the 2F-140's
# position register. The dwell was measured in MuJoCo over an unobstructed open, an empty
# close, and a close on that 66 mm cylinder: the fingers do not move for the first 20 to
# 40 ms after a command, so a dwell of 20 ms or less declares a stall before they start;
# from 50 ms up, the outcomes are the same (reached, reached, stopped short at 0.463). It
# is 100 ms, which was also consistent with the previous finger servo (80 ms and up).
schema = "ssrobot.MujocoProfile"
version = 1
keyframe = "ready"

# The simulated sensors (personalrobotics/ssrobot#221). MuJoCo's state carries no sensor
# noise, so this profile declares the resolution its readings are reported at, a
# modelling choice of the simulated sensor, not a measurement: each object pose to 0.001
# m per coordinate and 0.01 rad per rotation-vector component. These are the MuJoCo
# source's values; the physical robot's drivers declare their own, and the hardware is
# unmeasured.
object_resolution = { translation_m = 0.001, rotation_rad = 0.01 }

# When a scene object's pose counts as at rest in this simulation: within 0.002 m per
# coordinate and 0.02 rad of turn for 96 ms, one sample per 2 ms control tick with no
# tick dropped. The bounds are one resolution step above the largest stationary chatter
# of the reference scene's cylinder after it settles from a drop, and the dwell one tick
# longer than the longest interval it looked still and then moved (94 ms). The cylinder
# is the only object these traces cover; other objects may need their own. MuJoCo
# source's values; the hardware is unmeasured. Calibrated by ssrobot
# scripts/calibrate_rest.py at ssrobot 337554288706 on this repository at d139e8c06e9d,
# artifact sha256 d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a;
# reproduced by rerunning the script at those commits.
object_rest = { cadence_ns = 2000000, max_gap_ns = 2000000, dwell_ns = 96000000, translation_m = 0.002, rotation_rad = 0.02, source = "MuJoCo source's values, calibrated from recorded traces by ssrobot scripts/calibrate_rest.py at ssrobot 337554288706 on personalrobotics/geodude_assets@d139e8c06e9d: bounds one step above the largest stationary chatter after settling (2 steps of 0.001 m, 2 of 0.01 rad); dwell one tick longer than the longest interval that looked still and then moved, 94000000 ns, from drops of the reference scene's cylinder, the only object available, judged from the release; one sample per control tick; the hardware is unmeasured; reproduced by rerunning the script at those commits; artifact sha256 d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a" }

[[grippers]]
gripper = "left_gripper"
actuators = [{ actuator = "left_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "left_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

[[grippers]]
gripper = "right_gripper"
actuators = [{ actuator = "right_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "right_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

# How finely this simulation reports left_arm_with_lift_q: 2*pi/2^17 rad, a 17-bit
# encoder's step, per revolute joint, and 1e-6 m for the lift. A declared modelling
# choice of the simulated sensor; the hardware is unmeasured.
[[resolution]]
channel = "left_arm_with_lift_q"
step = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05]

# When left_arm_with_lift_q counts as at rest in this simulation: every joint within its
# variation (2, 2, 3, 2, 2, 2, 2 resolution steps, in joint order) for 128 ms, one
# sample per 2 ms control tick with no tick dropped. Each variation is one step above
# the largest stationary chatter of that joint once settled, and the dwell one tick
# longer than the longest interval the arm looked still and then moved (126 ms), over
# traces of reaches, out-and-backs through zero velocity, pauses, and single-joint moves
# judged from each trajectory's end. MuJoCo source's values; the hardware is unmeasured.
# Calibrated by ssrobot scripts/calibrate_rest.py at ssrobot 337554288706 on this
# repository at d139e8c06e9d, artifact sha256
# d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a; reproduced by
# rerunning the script at those commits.
[[rest]]
channel = "left_arm_with_lift_q"
criteria = { cadence_ns = 2000000, max_gap_ns = 2000000, dwell_ns = 128000000, variation = [2e-06, 9.587379924285257e-05, 0.00014381069886427886, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05], source = "MuJoCo source's values, calibrated from recorded traces by ssrobot scripts/calibrate_rest.py at ssrobot 337554288706 on personalrobotics/geodude_assets@d139e8c06e9d: variation one step above the largest stationary chatter after settling, per element ([2, 2, 3, 2, 2, 2, 2] steps of this profile's resolution); dwell one tick longer than the longest interval that looked still and then moved, 126000000 ns, judged from each trajectory's end; one sample per control tick; the hardware is unmeasured; reproduced by rerunning the script at those commits; artifact sha256 d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a" }

# How finely this simulation reports right_arm_with_lift_q: 2*pi/2^17 rad, a 17-bit
# encoder's step, per revolute joint, and 1e-6 m for the lift. A declared modelling
# choice of the simulated sensor; the hardware is unmeasured.
[[resolution]]
channel = "right_arm_with_lift_q"
step = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05]

# When right_arm_with_lift_q counts as at rest in this simulation: every joint within
# its variation (1, 2, 3, 2, 3, 2, 2 resolution steps, in joint order) for 118 ms, one
# sample per 2 ms control tick with no tick dropped. Each variation is one step above
# the largest stationary chatter of that joint once settled, and the dwell one tick
# longer than the longest interval the arm looked still and then moved (116 ms), over
# traces of reaches, out-and-backs through zero velocity, pauses, and single-joint moves
# judged from each trajectory's end. MuJoCo source's values; the hardware is unmeasured.
# Calibrated by ssrobot scripts/calibrate_rest.py at ssrobot 337554288706 on this
# repository at d139e8c06e9d, artifact sha256
# d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a; reproduced by
# rerunning the script at those commits.
[[rest]]
channel = "right_arm_with_lift_q"
criteria = { cadence_ns = 2000000, max_gap_ns = 2000000, dwell_ns = 118000000, variation = [1e-06, 9.587379924285257e-05, 0.00014381069886427886, 9.587379924285257e-05, 0.00014381069886427886, 9.587379924285257e-05, 9.587379924285257e-05], source = "MuJoCo source's values, calibrated from recorded traces by ssrobot scripts/calibrate_rest.py at ssrobot 337554288706 on personalrobotics/geodude_assets@d139e8c06e9d: variation one step above the largest stationary chatter after settling, per element ([1, 2, 3, 2, 3, 2, 2] steps of this profile's resolution); dwell one tick longer than the longest interval that looked still and then moved, 116000000 ns, judged from each trajectory's end; one sample per control tick; the hardware is unmeasured; reproduced by rerunning the script at those commits; artifact sha256 d5850ae7c9f2d89b8bd5c18d48907ff561010bb2d34d8e95f1746d72a39cf37a" }
