# MujocoRuntime settings for Geodude (see ssrobot's docs/mujoco.md): start at the cell's
# "ready" pose, and drive each Robotiq 2F-140 through its tendon actuator, whose control
# runs from 0 (open) to 255 (closed).
#
# The 2F-140's driver joints travel their full range whether or not the fingers are
# blocked: the spring links give way instead. So the actuator reads "closed" with an
# object between the fingers, and each gripper's opening is measured from its spring-link
# joint instead. Its position is -0.7019 rad closed on nothing, where the fingertips meet,
# and -0.0278 rad open, the same on both grippers. Closed on a 66 mm cylinder held across
# the fingers at the depths of sstsr's Robotiq2F140 side grasp, it reads 0.45 to 0.48.
#
# A gripper command ends when its fingers' motion ends (personalrobotics/ssrobot#219), by
# each gripper's completion detector on that opening: it reached its target once within
# goal_tolerance of it; it stopped short once its openings over stall_dwell_ns vary by
# no more than stall_delta. Both tolerances are 1/255, the resolution of the 2F-140's
# position register. The dwell was measured in MuJoCo over an unobstructed open, an empty
# close, and a close on that 66 mm cylinder: the fingers do not move for the first 20 to
# 40 ms after a command, so a dwell of 20 ms or less declares a stall before they start;
# from 50 ms up, the outcomes are the same (reached, reached, stopped short at 0.463). It
# is 100 ms, which was also consistent with the previous finger servo (80 ms and up).
schema = "ssrobot.MujocoProfile"
version = 1
keyframe = "ready"

# The simulated sensors (personalrobotics/ssrobot#221). MuJoCo's state carries no sensor
# noise: a held joint converges exactly, or to a limit cycle set by the constraint
# solver's tolerance. So this profile declares the resolution its readings are reported
# at, as a modelling choice of the simulated sensor, not a measurement. The physical
# robot's drivers declare their own, and until they are measured, none. Each object pose
# is reported to 0.001 m per coordinate and 0.01 rad per rotation-vector component,
# perception grade.
object_resolution = { translation_m = 0.001, rotation_rad = 0.01 }

# The signal of every scene object's pose, for rest watches: one sample per 2 ms control
# tick, a dropped tick breaking continuity, and readings within one step of the object
# resolution. No dwell: how long an object must stay still is the object's own, and each
# rest watch on an object supplies it (for a standing cylinder, its rocking period about
# its rim). Derived and verified by ssrobot scripts/calibrate_rest.py at 759876521d91,
# artifact artifacts/calibrate-rest/geodude.json (sha256 038c62c54c09bec4).
object_rest = { cadence_ns = 2000000, max_gap_ns = 2000000, translation_m = 0.001, rotation_rad = 0.01, source = "bounds: one step of this profile's declared object resolution, 0.001 m and 0.01 rad, a perception-grade modelling choice of the simulated sensor, not a measurement; the hardware is unmeasured. cadence and largest gap: one 2 ms control tick. No dwell: each object supplies its own; verified in MuJoCo 3.14.0 by ssrobot scripts/calibrate_rest.py at 759876521d91 on personalrobotics/geodude_assets@d139e8c06e9d, artifact ssrobot artifacts/calibrate-rest/geodude.json" }

[[grippers]]
gripper = "left_gripper"
actuators = [{ actuator = "left_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "left_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

[[grippers]]
gripper = "right_gripper"
actuators = [{ actuator = "right_ur5e/gripper/fingers_actuator", closed = 255.0, open = 0.0 }]
opening = { joint = "right_ur5e/gripper/right_spring_link_joint", closed = -0.7019, open = -0.0278 }
completion = { goal_tolerance = 0.00392156862745098, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }

# How finely this simulation reports left_arm_with_lift_q, its prismatic lift and 6
# revolute joints: 2*pi/2^17 rad, a 17-bit encoder's step, per revolute joint, and 1e-6
# m for the lift. A declared modelling choice of the simulated sensor; the hardware is
# unmeasured.
[[resolution]]
channel = "left_arm_with_lift_q"
step = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05]

# When left_arm_with_lift_q counts as at rest in this simulation: every joint within one
# step of its resolution for 244 ms, sampled every 2 ms control tick with no tick
# dropped. The dwell is the slowest response of the channel's servos, from the compiled
# model: left_ur5e/shoulder_lift_joint (kp 3000, c 101, largest joint inertia 3.362 over
# the calibration's configurations, zeta 0.503) overshoots by 8.15 steps from its
# largest arrival error, a visible oscillation, so its dwell is one damped period,
# 0.2433 s: readings within one step for a whole period leave less than half a step of
# amplitude. Derived and verified by ssrobot scripts/calibrate_rest.py at 759876521d91,
# artifact artifacts/calibrate-rest/geodude.json (sha256 038c62c54c09bec4).
[[rest]]
channel = "left_arm_with_lift_q"
criteria = { cadence_ns = 2000000, max_gap_ns = 2000000, dwell_ns = 244000000, variation = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05], source = "variation: one step of this profile's declared resolution per element (2*pi/2^17 rad per revolute joint, 1e-06 m per prismatic joint), a modelling choice of the simulated sensor, not a measurement; the hardware is unmeasured. dwell: left_ur5e/shoulder_lift_joint's servo, damped period 0.243339 s (kp 3000, c 101, largest M 3.36194 over the trials, zeta 0.503, first overshoot 8.15 steps from its largest arrival error 0.00243), the largest over the channel's joints, from the compiled model, rounded up to 122 ticks. cadence and largest gap: one 2 ms control tick; verified in MuJoCo 3.14.0 by ssrobot scripts/calibrate_rest.py at 759876521d91 on personalrobotics/geodude_assets@d139e8c06e9d, artifact ssrobot artifacts/calibrate-rest/geodude.json" }

# How finely this simulation reports right_arm_with_lift_q, its prismatic lift and 6
# revolute joints: 2*pi/2^17 rad, a 17-bit encoder's step, per revolute joint, and 1e-6
# m for the lift. A declared modelling choice of the simulated sensor; the hardware is
# unmeasured.
[[resolution]]
channel = "right_arm_with_lift_q"
step = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05]

# When right_arm_with_lift_q counts as at rest in this simulation: every joint within
# one step of its resolution for 250 ms, sampled every 2 ms control tick with no tick
# dropped. The dwell is the slowest response of the channel's servos, from the compiled
# model: right_ur5e/shoulder_lift_joint (kp 3000, c 101, largest joint inertia 3.638
# over the calibration's configurations, zeta 0.483) overshoots by 10.6 steps from its
# largest arrival error, a visible oscillation, so its dwell is one damped period, 0.25
# s: readings within one step for a whole period leave less than half a step of
# amplitude. Derived and verified by ssrobot scripts/calibrate_rest.py at 759876521d91,
# artifact artifacts/calibrate-rest/geodude.json (sha256 038c62c54c09bec4).
[[rest]]
channel = "right_arm_with_lift_q"
criteria = { cadence_ns = 2000000, max_gap_ns = 2000000, dwell_ns = 250000000, variation = [1e-06, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05], source = "variation: one step of this profile's declared resolution per element (2*pi/2^17 rad per revolute joint, 1e-06 m per prismatic joint), a modelling choice of the simulated sensor, not a measurement; the hardware is unmeasured. dwell: right_ur5e/shoulder_lift_joint's servo, damped period 0.249952 s (kp 3000, c 101, largest M 3.63836 over the trials, zeta 0.483, first overshoot 10.6 steps from its largest arrival error 0.00288), the largest over the channel's joints, from the compiled model, rounded up to 125 ticks. cadence and largest gap: one 2 ms control tick; verified in MuJoCo 3.14.0 by ssrobot scripts/calibrate_rest.py at 759876521d91 on personalrobotics/geodude_assets@d139e8c06e9d, artifact ssrobot artifacts/calibrate-rest/geodude.json" }
